<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Add User</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-50 to-slate-100 flex items-center justify-center min-h-screen">

<div class="bg-white p-8 rounded-2xl shadow-2xl w-[380px] animate-fade-in">
  <h2 class="text-2xl font-bold text-center mb-6 text-gray-800">
    Add New User
  </h2>

  <form method="POST">
    <input
      name="userName"
      placeholder="Username"
      required
      class="w-full mb-3 p-3 rounded-xl border focus:ring-2 focus:ring-indigo-500"
    >

    <input
      name="phone"
      placeholder="Phone"
      required
      class="w-full mb-4 p-3 rounded-xl border focus:ring-2 focus:ring-indigo-500"
    >

    <button
      class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-semibold transition"
    >
      Create User
    </button>
  </form>

  <a
    href="{{ url_for('home') }}"
    class="block text-center mt-4 text-indigo-600 font-medium"
  >
    ← Back to Dashboard
  </a>
</div>

</body>
</html>
